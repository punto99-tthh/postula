<script>


const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let TOKEN = TOKEN_INICIAL || '';
let vacantes = [], vacante = null, enlaceFijo = false;
let ocupado = false, terminada = false, vozActiva = true;

function srv(fn, ...args) {
  return new Promise((ok, err) => google.script.run.withSuccessHandler(ok)
    .withFailureHandler(e => err(new Error(((e && e.message) || String(e)).replace(/^Exception:\s*/, ''))))[fn](...args));
}
const espera = ms => new Promise(r => setTimeout(r, ms));

function seccion(id, paso) {
  ['sCargando', 'sMensaje', 'sLista', 'sFormulario', 'sEntrevista', 'sFin'].forEach(s => $(s).classList.toggle('oculto', s !== id));
  $('hero').classList.toggle('oculto', id === 'sEntrevista' || id === 'sFin');
  if (paso) document.querySelectorAll('#pasos li').forEach(li => {
    const n = Number(li.dataset.p);
    li.classList.toggle('activo', n === paso);
    li.classList.toggle('hecho', n < paso);
  });
  window.scrollTo(0, 0);
}
function error(msg) {
  $('errForm').textContent = msg || '';
  $('errForm').classList.toggle('oculto', !msg);
  if (msg) $('errForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

 
function ventana(estado, titulo, texto) {
  const caja = $('procCaja');
  caja.classList.remove('ok', 'error');
  if (estado) caja.classList.add(estado);
  $('procIcono').textContent = estado === 'ok' ? '✓' : estado === 'error' ? '✕' : '99';
  $('procTitulo').innerHTML = esc(titulo) + (estado ? '' : '<span class="puntos"></span>');
  $('procTexto').textContent = texto || '';
  $('procAcciones').classList.add('oculto');
  $('vProcesando').classList.remove('oculto');
}
const cerrarVentana = () => $('vProcesando').classList.add('oculto');
function esperarCierre() {
  $('procAcciones').classList.remove('oculto');
  $('procCerrar').focus();
  return new Promise(r => { $('procCerrar').onclick = () => { cerrarVentana(); r(); }; });
}

 
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.btn');
  if (!b || b.disabled) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height);
  const o = document.createElement('span');
  o.className = 'onda';
  o.style.cssText = 'width:' + d + 'px;height:' + d + 'px;left:' + (e.clientX - r.left - d / 2) + 'px;top:' + (e.clientY - r.top - d / 2) + 'px';
  b.appendChild(o);
  setTimeout(() => o.remove(), 600);
});

 

async function iniciar() {
  if (TOKEN) return abrirSala().catch(e => mensaje('No pudimos abrir tu entrevista', e.message));
  try {
    const r = await srv('portalVacantes', PROCESO_INICIAL || '');
    vacantes = r.vacantes; enlaceFijo = !!r.fija;
    if (r.error) return mensaje('Vacante no disponible', r.error);
    if (!vacantes.length) return mensaje('Sin vacantes abiertas', 'En este momento no tenemos procesos abiertos. Vuelve a visitarnos pronto.');
    if (enlaceFijo || vacantes.length === 1) return elegir(vacantes[0].id);
    pintarLista();
  } catch (e) { mensaje('No pudimos cargar las vacantes', e.message + ' Intenta recargar la página.'); }
}
function mensaje(titulo, texto) {
  $('msjTitulo').textContent = titulo;
  $('msjTexto').textContent = texto;
  $('msjAccion').innerHTML = '';
  seccion('sMensaje', 1);
}
function pintarLista() {
  $('listaVac').innerHTML = vacantes.map((v, i) =>
    '<div class="vac" style="--i:' + i + '"><div class="info"><div class="titulo">' + esc(v.cargo) + '</div>' +
    (v.resumen ? '<div class="resumen">' + esc(v.resumen) + '</div>' : '') +
    '</div><button class="btn primario" data-id="' + esc(v.id) + '">Postular</button></div>').join('');
  document.querySelectorAll('#listaVac [data-id]').forEach(b => b.addEventListener('click', () => elegir(b.dataset.id)));
  seccion('sLista', 1);
}
function elegir(id) {
  vacante = vacantes.find(v => v.id === id);
  $('vacSel').innerHTML =
    '<span class="etiqueta">Estás postulando a</span>' +
    '<h2>' + esc(vacante.cargo) + '</h2>' +
    (vacante.objetivo || vacante.resumen ? '<span class="objetivo-t">Objetivo del cargo</span><p class="objetivo">' + esc(vacante.objetivo || vacante.resumen) + '</p>' : '') +
    (!enlaceFijo && vacantes.length > 1 ? '<button type="button" class="btn mini" id="btnCambiar">← Elegir otra vacante</button>' : '');
  if ($('btnCambiar')) $('btnCambiar').addEventListener('click', pintarLista);
  error('');
  $('antes').classList.remove('oculto');
  $('form').classList.add('oculto');
  seccion('sFormulario', 1);
}
$('btnListo').addEventListener('click', () => {
  $('antes').classList.add('oculto');
  $('form').classList.remove('oculto');
  $('form').scrollIntoView({ behavior: 'smooth', block: 'start' });
  setTimeout(() => $('nombres').focus({ preventScroll: true }), 400);
});

const TIPOS = ['application/pdf', 'image/png', 'image/jpeg', 'image/webp'];
function prepararZona(zonaId, inputId) {
  const zona = $(zonaId), input = $(inputId), txt = zona.querySelector('.txt'), ico = zona.querySelector('.ico');
  const original = txt.textContent;
  const pintar = () => {
    const f = input.files[0];
    let malo = '';
    if (f && TIPOS.indexOf(f.type) < 0) malo = 'Formato no permitido: usa PDF o imagen.';
    else if (f && f.size > MAX_MB * 1048576) malo = 'El archivo supera ' + MAX_MB + ' MB.';
    if (malo) { input.value = ''; error(malo); }
    const ok = input.files[0];
    zona.classList.toggle('lleno', !!ok);
    txt.textContent = ok ? ok.name + ' · ' + (ok.size / 1048576).toFixed(1) + ' MB' : original;
    ico.textContent = ok ? '✓' : '↑';
  };
  input.addEventListener('change', pintar);
  ['dragenter', 'dragover'].forEach(ev => zona.addEventListener(ev, e => { e.preventDefault(); zona.classList.add('sobre'); }));
  ['dragleave', 'drop'].forEach(ev => zona.addEventListener(ev, () => zona.classList.remove('sobre')));
  zona.addEventListener('drop', e => {
    e.preventDefault();
    if (e.dataTransfer.files.length) { const dt = new DataTransfer(); dt.items.add(e.dataTransfer.files[0]); input.files = dt.files; pintar(); }
  });
}
prepararZona('zonaCv', 'cv');
prepararZona('zonaPort', 'portafolio');

function leerArchivo(file) {
  return new Promise((ok, err) => {
    if (!file) return ok(null);
    const r = new FileReader();
    r.onload = () => ok({ nombre: file.name, mime: file.type, base64: String(r.result).split(',')[1] });
    r.onerror = () => err(new Error('No se pudo leer ' + file.name));
    r.readAsDataURL(file);
  });
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  error('');
  const v = id => $(id).value.trim();
  const obligatorios = [['nombres', 'nombres'], ['apellidos', 'apellidos'], ['identificacion', 'cédula o pasaporte'],
    ['email', 'correo'], ['telefono', 'teléfono']];
  const faltan = obligatorios.filter(([id]) => !v(id));
  if (faltan.length) { $(faltan[0][0]).focus(); return error('Completa: ' + faltan.map(f => f[1]).join(', ') + '.'); }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('email'))) { $('email').focus(); return error('Revisa tu correo electrónico.'); }
  if (!valorCiudad()) { (ciudadElegida && ciudadElegida.otra ? $('ciudadOtra') : $('ciudad')).focus(); return error('Elige tu ciudad de residencia de la lista.'); }
  const asp = Number(v('aspiracion'));
  if (!(asp > 0)) { $('aspiracion').focus(); return error('Ingresa tu aspiración salarial mensual en USD.'); }
  if (asp > 50000) { $('aspiracion').focus(); return error('Revisa tu aspiración salarial: es un valor mensual en USD.'); }
  for (const id of ['linkedin', 'linkPortafolio']) {
    if (v(id) && !/^https?:\/\//i.test(v(id))) { $(id).focus(); return error('Los enlaces deben empezar con https://'); }
  }
  if (!$('cv').files[0]) return error('Adjunta tu hoja de vida.');
  if (!$('consentimiento').checked) return error('Para continuar debes aceptar la autorización de tratamiento de datos.');

  $('btnEnviar').disabled = true;
  ventana('', 'Enviando tu postulación', 'Estamos subiendo tus documentos. No cierres esta página.');
  try {
    const [cv, portafolio] = await Promise.all([leerArchivo($('cv').files[0]), leerArchivo($('portafolio').files[0])]);
    const r = await srv('registrarPostulacion', {
      idProceso: vacante.id, nombres: v('nombres'), apellidos: v('apellidos'), identificacion: v('identificacion'),
      email: v('email'), telefono: v('telefono'), ciudad: valorCiudad(), aspiracion: asp,
      disponibilidad: v('disponibilidad'), linkedin: v('linkedin'), linkPortafolio: v('linkPortafolio'),
      consentimiento: true, cv: cv, portafolio: portafolio
    });
    TOKEN = r.token;
    try { history.replaceState(null, '', '?t=' + TOKEN); } catch (x) {   }
    if (!r.reanudar) {
      ventana('', 'Preparando tu entrevista', 'Estamos revisando tu perfil para preparar las preguntas.\nEsto toma menos de un minuto.');
      await srv('analizarPostulacion', TOKEN);   
    }
    ventana('ok', r.reanudar ? '¡Hola de nuevo, ' + r.nombre + '!' : '¡Listo, ' + r.nombre + '!',
      r.reanudar ? 'Ya tenemos tu postulación. Continúa con tu entrevista.' : 'Tu postulación fue recibida. Ahora sigue la entrevista.');
    await espera(1300);
    cerrarVentana();
    await abrirSala();
  } catch (err) {
    ventana('error', 'No se pudo enviar', err.message);
    await esperarCierre();
  } finally {
    $('btnEnviar').disabled = false;
  }
});


 
const CIUDADES = [
  
  ['Quito', 'Pichincha'], ['Guayaquil', 'Guayas'], ['Cuenca', 'Azuay'], ['Ambato', 'Tungurahua'], ['Santo Domingo', 'Santo Domingo de los Tsáchilas'],
  ['Machala', 'El Oro'], ['Portoviejo', 'Manabí'], ['Loja', 'Loja'], ['Riobamba', 'Chimborazo'], ['Ibarra', 'Imbabura'], ['Esmeraldas', 'Esmeraldas'],
  ['Babahoyo', 'Los Ríos'], ['Latacunga', 'Cotopaxi'], ['Santa Elena', 'Santa Elena'], ['Tulcán', 'Carchi'], ['Azogues', 'Cañar'],
  ['Guaranda', 'Bolívar'], ['Puyo', 'Pastaza'], ['Tena', 'Napo'], ['Macas', 'Morona Santiago'], ['Zamora', 'Zamora Chinchipe'],
  ['Nueva Loja (Lago Agrio)', 'Sucumbíos'], ['Puerto Francisco de Orellana (El Coca)', 'Orellana'], ['Puerto Baquerizo Moreno', 'Galápagos'],
  
  ['Quito — Cumbayá', 'Pichincha'], ['Quito — Tumbaco', 'Pichincha'], ['Quito — Calderón', 'Pichincha'], ['Quito — Conocoto', 'Pichincha'],
  ['Quito — Pomasqui', 'Pichincha'], ['Sangolquí', 'Pichincha'], ['Cayambe', 'Pichincha'], ['Machachi', 'Pichincha'], ['Tabacundo', 'Pichincha'],
  ['San Miguel de los Bancos', 'Pichincha'], ['Pedro Vicente Maldonado', 'Pichincha'], ['Puerto Quito', 'Pichincha'],
  
  ['Durán', 'Guayas'], ['Samborondón', 'Guayas'], ['Daule', 'Guayas'], ['Milagro', 'Guayas'], ['Playas', 'Guayas'], ['El Empalme', 'Guayas'],
  ['Yaguachi', 'Guayas'], ['Naranjal', 'Guayas'], ['Balzar', 'Guayas'],
  
  ['Manta', 'Manabí'], ['Chone', 'Manabí'], ['Montecristi', 'Manabí'], ['Jipijapa', 'Manabí'], ['El Carmen', 'Manabí'],
  ['Bahía de Caráquez', 'Manabí'], ['Pedernales', 'Manabí'],
  
  ['Quevedo', 'Los Ríos'], ['Ventanas', 'Los Ríos'], ['Vinces', 'Los Ríos'], ['Buena Fe', 'Los Ríos'],
  ['Otavalo', 'Imbabura'], ['Cotacachi', 'Imbabura'], ['Atuntaqui', 'Imbabura'],
  ['La Libertad', 'Santa Elena'], ['Salinas', 'Santa Elena'],
  ['Pasaje', 'El Oro'], ['Santa Rosa', 'El Oro'], ['Huaquillas', 'El Oro'], ['El Guabo', 'El Oro'], ['Piñas', 'El Oro'],
  ['Gualaceo', 'Azuay'], ['Paute', 'Azuay'], ['La Troncal', 'Cañar'], ['Cañar', 'Cañar'], ['Catamayo', 'Loja'],
  ['Pelileo', 'Tungurahua'], ['Baños de Agua Santa', 'Tungurahua'], ['Salcedo', 'Cotopaxi'], ['La Maná', 'Cotopaxi'], ['Pujilí', 'Cotopaxi'],
  ['Alausí', 'Chimborazo'], ['Guano', 'Chimborazo'], ['Quinindé', 'Esmeraldas'], ['Atacames', 'Esmeraldas'], ['San Gabriel', 'Carchi'],
  ['La Concordia', 'Santo Domingo de los Tsáchilas'], ['Shushufindi', 'Sucumbíos'], ['Puerto Ayora', 'Galápagos'],
  ['Yantzaza', 'Zamora Chinchipe'], ['Gualaquiza', 'Morona Santiago'], ['Sucúa', 'Morona Santiago']
].map(([c, p]) => ({ ciudad: c, provincia: p, texto: c + ' (' + p + ')' }));
const OTRA = [{ otra: 'ec', texto: 'Otra ciudad del Ecuador' }, { otra: 'ext', texto: 'Vivo fuera del Ecuador' }];
const norm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
let ciudadElegida = null, opcionesCiudad = [], activa = -1;

function filtrarCiudades(q) {
  const n = norm(q);
  if (!n) return CIUDADES.slice(0, 24).concat(OTRA);
  const empieza = [], contiene = [];
  CIUDADES.forEach(c => {
    const palabras = norm(c.ciudad).split(/[\s—()-]+/);
    if (norm(c.ciudad).startsWith(n) || palabras.some(w => w.startsWith(n))) empieza.push(c);
    else if (norm(c.texto).includes(n)) contiene.push(c);
  });
  return empieza.concat(contiene).slice(0, 40).concat(OTRA);
}
function resaltar(texto, q) {
  const n = norm(q);
  if (!n) return esc(texto);
  const i = norm(texto).indexOf(n);
  return i < 0 ? esc(texto) : esc(texto.slice(0, i)) + '<b>' + esc(texto.slice(i, i + n.length)) + '</b>' + esc(texto.slice(i + n.length));
}
function pintarCiudades() {
  const q = $('ciudad').value;
  opcionesCiudad = filtrarCiudades(q);
  const reales = opcionesCiudad.filter(o => !o.otra).length;
  $('listaCiudades').innerHTML = (reales ? '' : '<li class="nada">No encontramos esa ciudad. Elige una opción de abajo.</li>') +
    opcionesCiudad.map((o, i) => '<li role="option" data-i="' + i + '" class="' + (o.otra ? 'otra' : '') + (i === activa ? ' activo' : '') + '">' +
      (o.otra ? esc(o.texto) : '<span>' + resaltar(o.ciudad, q) + '</span><small>' + esc(o.provincia) + '</small>') + '</li>').join('');
  abrirLista(true);
}
function abrirLista(abrir) {
  $('listaCiudades').classList.toggle('oculto', !abrir);
  $('ciudad').setAttribute('aria-expanded', abrir ? 'true' : 'false');
}
function elegirCiudad(o) {
  ciudadElegida = o;
  $('ciudad').value = o.texto;
  $('comboCiudad').classList.toggle('ok', !o.otra);
  $('ciudadOtra').classList.toggle('oculto', !o.otra);
  if (o.otra) { $('ciudadOtra').placeholder = o.otra === 'ext' ? 'Ciudad y país donde vives' : 'Escribe tu ciudad'; $('ciudadOtra').focus(); }
  abrirLista(false);
}
$('ciudad').addEventListener('focus', () => { activa = -1; pintarCiudades(); });
$('ciudad').addEventListener('input', () => {
  ciudadElegida = null; activa = 0;
  $('comboCiudad').classList.remove('ok'); $('ciudadOtra').classList.add('oculto');
  pintarCiudades();
});
$('ciudad').addEventListener('keydown', e => {
  if ($('listaCiudades').classList.contains('oculto') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { pintarCiudades(); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); activa = Math.min(activa + 1, opcionesCiudad.length - 1); pintarCiudades(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); activa = Math.max(activa - 1, 0); pintarCiudades(); }
  else if (e.key === 'Enter') { if (activa >= 0 && opcionesCiudad[activa]) { e.preventDefault(); elegirCiudad(opcionesCiudad[activa]); } }
  else if (e.key === 'Escape') abrirLista(false);
  const li = $('listaCiudades').querySelector('li.activo');
  if (li) li.scrollIntoView({ block: 'nearest' });
});
$('listaCiudades').addEventListener('mousedown', e => {
  const li = e.target.closest('li[data-i]');
  if (!li) return;
  e.preventDefault();
  elegirCiudad(opcionesCiudad[Number(li.dataset.i)]);
});
$('ciudad').addEventListener('blur', () => setTimeout(() => {
  abrirLista(false);
  if (!ciudadElegida) {   
    const exacta = CIUDADES.find(c => norm(c.ciudad) === norm($('ciudad').value) || norm(c.texto) === norm($('ciudad').value));
    if (exacta) elegirCiudad(exacta);
  }
}, 120));
function valorCiudad() {
  if (!ciudadElegida) return '';
  if (!ciudadElegida.otra) return ciudadElegida.texto;
  const t = $('ciudadOtra').value.trim();
  return t ? (ciudadElegida.otra === 'ext' ? 'Exterior: ' : 'Otra: ') + t : '';
}

 

async function abrirSala() {
  const d = await srv('datosPostulacion', TOKEN);
  if (d.completada) {
    $('finTitulo').textContent = '¡Gracias, ' + d.nombre + '!';
    $('finTexto').textContent = 'Tu postulación a ' + d.cargo + ' ya está completa. Talento Humano te contactará por correo electrónico.';
    return seccion('sFin', 3);
  }
  $('cargoEntrevista').textContent = d.cargo;
  $('subtitulo').textContent = 'Hola ' + d.nombre + ', cuando estés listo o lista presiona "Comenzar entrevista".';
  seccion('sEntrevista', 2);
}

function agregarMsg(texto, quien) {
  const div = document.createElement('div');
  div.className = 'msg ' + quien;
  if (quien === 'ia escribiendo') div.innerHTML = '<i></i><i></i><i></i>'; else div.textContent = texto;
  $('chat').appendChild(div);
  $('chat').scrollTop = $('chat').scrollHeight;
  return div;
}
function estadoAvatar(estado, texto) {
  const w = $('avatarWrap');
  w.classList.remove('hablando', 'escuchando', 'pensando');
  if (estado) w.classList.add(estado);
  $('estadoAvatar').textContent = texto;
}



const puedeGrabar = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
let motor = puedeGrabar ? 'grabacion' : '';
let modo = motor ? 'voz' : 'escrito';
let turnoId = 0, regrabaciones = 0, cancelarReloj = null, fase = '';
let grabadora = null, trozos = [], flujo = null, medidor = null, nota = null, ultimoEnvio = 'texto';

function mostrar(id, si) { $(id).classList.toggle('oculto', !si); }
function panel(cual) {          
  
  mostrar('recordatorio', (cual === 'voz' || cual === 'escrito') && Number($('barraProgreso').dataset.i || 0) < 4);
  mostrar('vozPanel', cual === 'voz');
  mostrar('audioPanel', cual === 'audio');
  mostrar('escritoPanel', cual === 'escrito');
  if (cual && window.matchMedia('(max-width: 760px)').matches)
    requestAnimationFrame(() => $('entrada').scrollIntoView({ behavior: 'smooth', block: 'end' }));
  mostrar('btnModo', !!motor && cual !== '' && cual !== 'audio');
  $('btnModo').textContent = modo === 'voz' ? '✍️ Prefiero escribir mi respuesta' : '🎤 Responder con nota de voz';
}
function bloquear(b) {
  ocupado = b;
  ['btnResponder', 'btnTerminar', 'btnRegrabar', 'btnModo', 'btnEnviarAudio'].forEach(id => { $(id).disabled = b; });
  $('respuesta').disabled = b;
}

 
function relojAnillo(seg, texto, clase, alTerminar) {
  const anillo = $('relojAvance'), L = 326.7, t0 = Date.now();
  $('reloj').className = 'reloj ' + (clase || '');
  $('relojTxt').textContent = texto;
  let vivo = true;
  const paso = () => {
    if (!vivo) return;
    const resta = Math.max(0, seg - (Date.now() - t0) / 1000);
    const r = Math.ceil(resta);
    $('relojNum').textContent = seg >= 60 ? Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0') : r;
    anillo.style.strokeDashoffset = (L * (1 - resta / seg)).toFixed(1);
    $('reloj').classList.toggle('poco', clase === 'grabando' && resta <= 10);
    if (resta <= 0) { vivo = false; alTerminar(); return; }
    setTimeout(paso, 200);
  };
  paso();
  return () => { vivo = false; };
}
function pararReloj() { if (cancelarReloj) cancelarReloj(); cancelarReloj = null; }

function iniciarTurno() {
  const id = ++turnoId;
  regrabaciones = 0; nota = null;
  $('respuesta').value = '';
  bloquear(false);
  if (modo === 'voz') prepararVoz(id); else modoEscrito(id, '');
}

 
function prepararVoz(id) {
  fase = 'prep';
  $('turnoMsg').textContent = 'Prepárate: la grabación empieza sola en ' + TIEMPOS.prep + ' segundos.';
  $('textoVivo').textContent = '';
  $('textoVivo').dataset.vacio = 'Cuando empiece la grabación, responde con calma. Tienes hasta ' + (TIEMPOS.voz >= 60 ? TIEMPOS.voz / 60 + ' minuto' + (TIEMPOS.voz > 60 ? 's' : '') : TIEMPOS.voz + ' segundos') + '.';
  mostrar('btnEmpezarYa', true); mostrar('btnParar', false); mostrar('nivelMic', false);
  panel('voz');
  estadoAvatar('', 'Prepárate');
  pararReloj();
  cancelarReloj = relojAnillo(TIEMPOS.prep, 'Prepárate', '', () => { if (id === turnoId) grabar(id); });
}
$('btnEmpezarYa').addEventListener('click', () => { if (fase === 'prep') { pararReloj(); grabar(turnoId); } });

 
async function grabar(id) {
  fase = 'grabando';
  $('turnoMsg').textContent = 'Te estamos grabando. Cuando termines, pulsa "Terminar respuesta".';
  mostrar('btnEmpezarYa', false); mostrar('btnParar', true);
  estadoAvatar('escuchando', 'Te escucho…');
  try { await iniciarGrabadora(); }
  catch (e) {
    motor = ''; modo = 'escrito';
    return modoEscrito(id, 'No pudimos usar tu micrófono. Revisa el permiso del navegador o escribe tu respuesta.');
  }
  if (id !== turnoId) return;
  pararReloj();
  cancelarReloj = relojAnillo(TIEMPOS.voz, 'Grabando', 'grabando', () => { if (id === turnoId && fase === 'grabando') terminarGrabacion(id, true); });
}

    ANIM.objX = desvio ? (Math.random() - 0.5) * 4 : (Math.random() - 0.5) * 0.8;
    ANIM.objY = desvio ? (Math.random() - 0.6) * 1.8 : (Math.random() - 0.5) * 0.5;
    ANIM.proxMirada = ahora + (desvio ? 500 + Math.random() * 700 : 1200 + Math.random() * 2200);
  }
  if (piensa) { ANIM.objX = 2.4; ANIM.objY = -1.8; }
  ANIM.miradaX = suave(ANIM.miradaX, ANIM.objX, 0.3); ANIM.miradaY = suave(ANIM.miradaY, ANIM.objY, 0.3);
  $('iris').setAttribute('transform', 'translate(' + ANIM.miradaX.toFixed(2) + ' ' + ANIM.miradaY.toFixed(2) + ')');

   
  ANIM.cejaImp *= 0.93;
  if (ahora > ANIM.proxAsim) { ANIM.asim = Math.random() < 0.4 ? (Math.random() - 0.5) * 2.2 : 0; ANIM.proxAsim = ahora + 2500 + Math.random() * 4000; }
  const base = ANIM.hablando ? 0.9 + ANIM.cejaImp * 2.2 : escucha ? 1.2 : piensa ? 1.8 : 0.2;
  ANIM.cejaI = suave(ANIM.cejaI, base + (piensa ? 1 : 0) + Math.max(0, ANIM.asim), 0.12);
  ANIM.cejaD = suave(ANIM.cejaD, base + Math.max(0, -ANIM.asim), 0.12);
  $('cejaIzq').setAttribute('transform', 'translate(0 ' + (-ANIM.cejaI).toFixed(2) + ')');
  $('cejaDer').setAttribute('transform', 'translate(0 ' + (-ANIM.cejaD).toFixed(2) + ')');
  requestAnimationFrame(animar);
})();
function parpadeo() {
  $('ojos').classList.add('parpadeo');
  setTimeout(() => $('ojos').classList.remove('parpadeo'), 110);
}
(function parpadear() {
  parpadeo();
  if (Math.random() < 0.18) setTimeout(parpadeo, 250);
  setTimeout(parpadear, 2000 + Math.random() * 3500);
})();

iniciar();
</script>
